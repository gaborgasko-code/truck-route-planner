<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truck Route Planner - test runner</title>
<link rel="stylesheet" href="../css/theme.css">
<style>
  body { padding: 0 0 40px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
  .summary {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 16px; border-radius: var(--radius); margin-bottom: 18px;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .summary__count { font-size: 26px; font-weight: 800; }
  .summary--ok { border-left: 6px solid var(--ok); }
  .summary--bad { border-left: 6px solid var(--danger); }
  .suite { margin-bottom: 16px; }
  .suite > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--blue-700); }
  .t { display: flex; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
  .t__tag { font-size: 10.5px; font-weight: 800; border-radius: 4px; padding: 2px 6px; height: fit-content; }
  .t--ok .t__tag { background: rgba(26,156,83,.16); color: var(--ok); }
  .t--bad .t__tag { background: rgba(200,50,46,.14); color: var(--danger); }
  .t__err { display: block; color: var(--danger); font-family: var(--mono); font-size: 12px; margin-top: 3px; }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="brand__mark" aria-hidden="true">&#10003;</div>
    <div>
      <h1 class="brand__title">Truck Route Planner - test runner</h1>
      <div class="brand__tagline">Core logic only, no network calls</div>
    </div>
  </div>
  <div class="header-meta">
    <span class="author-badge">created by Gabor Gasko</span>
  </div>
</header>

<div class="wrap">
  <div class="summary" id="summary"><span>Running tests...</span></div>
  <div id="results"></div>
  <p class="note">The same suites run headless with <code>node tests/run_node.js</code>.</p>
</div>

<script src="../js/core/config.js"></script>
<script src="../js/core/util.js"></script>
<script src="../js/core/geo.js"></script>
<script src="../js/core/embedded-data.js"></script>
<script src="../js/core/data-store.js"></script>
<script src="../js/core/time-model.js"></script>
<script src="../js/core/tolls.js"></script>
<script src="../js/core/stops.js"></script>
<script src="../js/core/regulations.js"></script>
<script src="../js/core/planner.js"></script>

<script src="harness.js"></script>
<script src="test_time_estimation.js"></script>
<script src="test_toll_estimation.js"></script>
<script src="test_stop_suggestions.js"></script>

<script>
(function () {
  'use strict';
  var esc = TRP.util.escapeHtml;
  var groups = {};
  var order = [];

  var summary = TRPTest.run(function (entry) {
    if (!groups[entry.suite]) { groups[entry.suite] = []; order.push(entry.suite); }
    groups[entry.suite].push(entry);
  });

  document.getElementById('results').innerHTML = order.map(function (name) {
    var rows = groups[name].map(function (t) {
      return '<div class="t ' + (t.ok ? 't--ok' : 't--bad') + '">' +
        '<span class="t__tag">' + (t.ok ? 'PASS' : 'FAIL') + '</span>' +
        '<span>' + esc(t.name) +
        (t.ok ? '' : '<span class="t__err">' + esc(t.error) + '</span>') + '</span></div>';
    }).join('');
    return '<section class="card suite"><h2>' + esc(name) + '</h2>' + rows + '</section>';
  }).join('');

  var box = document.getElementById('summary');
  box.className = 'summary ' + (summary.failed ? 'summary--bad' : 'summary--ok');
  box.innerHTML = '<span class="summary__count">' + summary.passed + ' / ' +
    (summary.passed + summary.failed) + '</span><span>' +
    (summary.failed ? summary.failed + ' test(s) failed' : 'all tests passed') + '</span>';
  document.title = (summary.failed ? 'FAIL' : 'PASS') + ' - Truck Route Planner tests';
})();
</script>
</body>
</html>
