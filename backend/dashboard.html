<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Traffic - Route Planner</title>
<style>
  :root {
    --bg: #f3f6fb;
    --surface: #ffffff;
    --surface-2: #f7f9fc;
    --line: #dfe6ef;
    --ink: #0f1f3a;
    --ink-soft: #33465f;
    --muted: #61738c;
    --accent: #1f5fd0;
    --teal: #0e9f8e;
    --danger: #c73a3a;
    --radius: 12px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Inter, Arial, sans-serif;
  }
  header {
    background: linear-gradient(100deg, #0f2a62 0%, #164393 55%, #1f5fd0 100%);
    color: #fff; padding: 16px 22px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { font-size: 12.5px; color: #cfe1f8; }
  header .by { margin-left: auto; font-size: 12px; color: #ffd66b; font-weight: 600; }

  main { max-width: 1120px; margin: 0 auto; padding: 20px 18px 48px; }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px;
  }
  .card h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); margin: 0 0 12px;
  }

  /* Filters sit in one row above the charts. */
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .filters input, .filters button, .filters select {
    font: inherit; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); border-radius: 9px; padding: 8px 12px;
  }
  .filters button { cursor: pointer; }
  .filters button.is-active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .filters .spacer { flex: 1 1 auto; }
  .filters input[type="password"] { min-width: 240px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile__label { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700; }
  .tile__value { font-size: 30px; font-weight: 700; letter-spacing: -.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile__sub { font-size: 12px; color: var(--muted); }

  .legend { display: flex; gap: 16px; margin-bottom: 6px; font-size: 12.5px; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; }

  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; }
  .tip {
    position: absolute; pointer-events: none; opacity: 0;
    background: var(--ink); color: #fff; border-radius: 8px;
    padding: 7px 10px; font-size: 12px; white-space: nowrap;
    transform: translate(-50%, -120%); transition: opacity .1s;
    box-shadow: 0 6px 18px rgba(15, 31, 58, .3);
  }
  .tip b { font-weight: 700; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }

  .bars { list-style: none; margin: 0; padding: 0; }
  .bars li { margin-bottom: 9px; }
  .bars__row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 3px; }
  .bars__row span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bars__track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .bars__fill { height: 100%; background: var(--accent); border-radius: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  .msg { padding: 14px 16px; border-radius: 10px; font-size: 13.5px; }
  .msg--err { background: #fdefef; border: 1px solid #f6c2c2; color: var(--danger); }
  .msg--info { background: #e8f0fd; border: 1px solid #b5cdf5; color: #164393; }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
  details summary { cursor: pointer; font-size: 12.5px; color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Route Planner &mdash; traffic</h1>
    <div class="sub">Anonymous, aggregated audience measurement</div>
  </div>
  <div class="by">created by Gabor Gasko</div>
</header>

<main>
  <div class="filters">
    <input type="password" id="token" placeholder="Access token" autocomplete="off">
    <button type="button" data-range="7">7 days</button>
    <button type="button" data-range="30" class="is-active">30 days</button>
    <button type="button" data-range="90">90 days</button>
    <button type="button" data-range="all">All</button>
    <span class="spacer"></span>
    <button type="button" id="reload">Refresh</button>
  </div>

  <div id="message" class="msg msg--info">Enter the access token to load the numbers.</div>

  <div id="report" hidden>
    <section class="card">
      <h2>Totals for the selected range</h2>
      <div class="tiles" id="tiles"></div>
    </section>

    <section class="card">
      <h2>Daily traffic</h2>
      <div class="legend">
        <span><i class="swatch" style="background:#1f5fd0"></i>Page views</span>
        <span><i class="swatch" style="background:#0e9f8e"></i>Daily visitors</span>
      </div>
      <div class="chart" id="chart">
        <div class="tip" id="tip"></div>
      </div>
      <details>
        <summary>Show as a table</summary>
        <div style="max-height:280px;overflow:auto;margin-top:10px">
          <table id="seriesTable">
            <thead><tr><th>Day</th><th class="num">Views</th><th class="num">Visitors</th><th class="num">Routes</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </details>
    </section>

    <div class="grid2" id="breakdowns"></div>

    <p class="note" id="footnote"></p>
  </div>
</main>

<script>
(function () {
  'use strict';

  var TOKEN_KEY = 'trp.dash.token';
  var state = { range: '30', data: null };

  var el = {
    token: document.getElementById('token'),
    message: document.getElementById('message'),
    report: document.getElementById('report'),
    tiles: document.getElementById('tiles'),
    chart: document.getElementById('chart'),
    tip: document.getElementById('tip'),
    breakdowns: document.getElementById('breakdowns'),
    seriesTable: document.querySelector('#seriesTable tbody'),
    footnote: document.getElementById('footnote')
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function num(n) { return Number(n || 0).toLocaleString('en-GB'); }

  function setMessage(text, kind) {
    el.message.textContent = text;
    el.message.className = 'msg msg--' + (kind || 'info');
    el.message.hidden = !text;
  }

  /* ------------------------------------------------------------- loading */

  function fromDate(range) {
    if (range === 'all') return '';
    var d = new Date();
    d.setUTCDate(d.getUTCDate() - (Number(range) - 1));
    return d.toISOString().slice(0, 10);
  }

  function load() {
    var token = el.token.value.trim();
    if (!token) { setMessage('Enter the access token to load the numbers.', 'info'); return; }
    try { sessionStorage.setItem(TOKEN_KEY, token); } catch (e) { /* ignore */ }

    /*
     * Build the API URL from the page's own address rather than from '/'.
     * This page is served both by backend/server.js at the root and by a
     * Cloud Function mounted under a path like /analytics, and the function
     * cannot see its own mount point - the platform strips the function name
     * before the request arrives, so req.path is always '/' and the server
     * has no way to redirect or rewrite. Only the browser knows the real URL.
     * Forcing a trailing slash makes the relative join correct in every case:
     *   /            -> /api/stats
     *   /analytics   -> /analytics/api/stats
     *   /analytics/  -> /analytics/api/stats
     */
    var base = location.href.split('?')[0].split('#')[0];
    if (base.charAt(base.length - 1) !== '/') base += '/';
    var url = base + 'api/stats?token=' + encodeURIComponent(token);
    var from = fromDate(state.range);
    if (from) url += '&from=' + from;

    setMessage('Loading...', 'info');
    fetch(url, { cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) throw new Error('The token was not accepted.');
        if (!r.ok) throw new Error('The server replied with HTTP ' + r.status + '.');
        return r.json();
      })
      .then(function (payload) {
        state.data = payload;
        render(payload);
        setMessage('', 'info');
        el.report.hidden = false;
      })
      .catch(function (err) {
        el.report.hidden = true;
        setMessage(err.message, 'err');
      });
  }

  /* ------------------------------------------------------------ rendering */

  function tile(label, value, sub) {
    return '<div class="tile"><div class="tile__label">' + esc(label) + '</div>' +
      '<div class="tile__value">' + esc(value) + '</div>' +
      '<div class="tile__sub">' + esc(sub || '') + '</div></div>';
  }

  function barList(items, total) {
    if (!items.length) return '<p class="note">No data yet.</p>';
    var max = Math.max.apply(null, items.map(function (i) { return i.count; }));
    return '<ul class="bars">' + items.map(function (i) {
      var share = total ? Math.round((i.count / total) * 100) : 0;
      return '<li><div class="bars__row"><span>' + esc(i.key) + '</span>' +
        '<span>' + num(i.count) + (total ? ' &middot; ' + share + '%' : '') + '</span></div>' +
        '<div class="bars__track"><div class="bars__fill" style="width:' +
        Math.max(2, Math.round((i.count / max) * 100)) + '%"></div></div></li>';
    }).join('') + '</ul>';
  }

  function card(title, body) {
    return '<section class="card"><h2>' + esc(title) + '</h2>' + body + '</section>';
  }

  /**
   * Two series, one axis, same unit (counts). Recessive grid, 2px lines,
   * a crosshair tooltip, and a table view in the <details> above.
   */
  function drawChart(series) {
    var W = 900, H = 260, padL = 44, padR = 12, padT = 14, padB = 26;
    if (!series.length) {
      el.chart.innerHTML = '<p class="note">No days in this range yet.</p>';
      return;
    }
    var maxValue = Math.max(1, Math.max.apply(null, series.map(function (d) {
      return Math.max(d.views, d.visitors);
    })));
    /* Round the axis up to something readable. */
    var step = Math.pow(10, Math.floor(Math.log10(maxValue)));
    var top = Math.ceil(maxValue / step) * step;

    var innerW = W - padL - padR;
    var innerH = H - padT - padB;
    var x = function (i) {
      return padL + (series.length === 1 ? innerW / 2 : (i / (series.length - 1)) * innerW);
    };
    var y = function (v) { return padT + innerH - (v / top) * innerH; };

    function pathFor(key) {
      return series.map(function (d, i) {
        return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(d[key]).toFixed(1);
      }).join(' ');
    }

    var ticks = [0, top / 2, top];
    var grid = ticks.map(function (v) {
      return '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v).toFixed(1) +
        '" y2="' + y(v).toFixed(1) + '" stroke="#e6ecf4" stroke-width="1"/>' +
        '<text x="' + (padL - 8) + '" y="' + (y(v) + 4).toFixed(1) +
        '" text-anchor="end" font-size="11" fill="#93a3b8">' + num(Math.round(v)) + '</text>';
    }).join('');

    /* Label the ends and the middle only, so the axis never collides. */
    var labelIdx = series.length <= 2 ? series.map(function (_, i) { return i; })
      : [0, Math.floor(series.length / 2), series.length - 1];
    var xLabels = labelIdx.map(function (i) {
      var anchor = i === 0 ? 'start' : (i === series.length - 1 ? 'end' : 'middle');
      return '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + anchor +
        '" font-size="11" fill="#93a3b8">' + esc(series[i].day.slice(5)) + '</text>';
    }).join('');

    var dots = series.length <= 45 ? series.map(function (d, i) {
      return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(d.views).toFixed(1) +
        '" r="3" fill="#1f5fd0" stroke="#fff" stroke-width="2"/>' +
        '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(d.visitors).toFixed(1) +
        '" r="3" fill="#0e9f8e" stroke="#fff" stroke-width="2"/>';
    }).join('') : '';

    el.chart.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Daily page views and visitors">' +
      grid + xLabels +
      '<path d="' + pathFor('views') + '" fill="none" stroke="#1f5fd0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<path d="' + pathFor('visitors') + '" fill="none" stroke="#0e9f8e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots +
      '<line id="cross" x1="0" x2="0" y1="' + padT + '" y2="' + (padT + innerH) +
      '" stroke="#93a3b8" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>' +
      '<rect id="hit" x="' + padL + '" y="' + padT + '" width="' + innerW + '" height="' + innerH + '" fill="transparent"/>' +
      '</svg><div class="tip" id="tip"></div>';

    el.tip = el.chart.querySelector('.tip');
    var svg = el.chart.querySelector('svg');
    var cross = svg.querySelector('#cross');

    svg.addEventListener('mousemove', function (event) {
      var box = svg.getBoundingClientRect();
      var px = ((event.clientX - box.left) / box.width) * W;
      if (px < padL || px > W - padR) { hideTip(); return; }
      var i = series.length === 1 ? 0
        : Math.round(((px - padL) / innerW) * (series.length - 1));
      i = Math.max(0, Math.min(series.length - 1, i));
      var d = series[i];
      cross.setAttribute('x1', x(i));
      cross.setAttribute('x2', x(i));
      cross.setAttribute('opacity', '1');
      el.tip.innerHTML = '<b>' + esc(d.day) + '</b><br>' + num(d.views) + ' views &middot; ' +
        num(d.visitors) + ' visitors<br>' + num(d.routes) + ' routes';
      el.tip.style.left = ((x(i) / W) * box.width) + 'px';
      el.tip.style.top = ((y(Math.max(d.views, d.visitors)) / H) * box.height) + 'px';
      el.tip.style.opacity = '1';
    });
    svg.addEventListener('mouseleave', hideTip);

    function hideTip() {
      el.tip.style.opacity = '0';
      cross.setAttribute('opacity', '0');
    }
  }

  function render(payload) {
    var s = payload.stats;
    var t = s.totals;
    var days = s.series.length || 1;

    el.tiles.innerHTML =
      tile('Daily visitors', num(t.visitors), Math.round(t.visitors / days) + ' per day') +
      tile('Page views', num(t.views), Math.round(t.views / days) + ' per day') +
      tile('Routes calculated', num(t.routes),
        t.views ? Math.round((t.routes / t.views) * 100) + '% of views' : '') +
      tile('Failed calculations', num(t.failures),
        t.routes + t.failures ? Math.round((t.failures / (t.routes + t.failures)) * 100) + '% of attempts' : '');

    drawChart(s.series);

    el.seriesTable.innerHTML = s.series.slice().reverse().map(function (d) {
      return '<tr><td>' + esc(d.day) + '</td><td class="num">' + num(d.views) +
        '</td><td class="num">' + num(d.visitors) + '</td><td class="num">' + num(d.routes) + '</td></tr>';
    }).join('');

    el.breakdowns.innerHTML =
      card('Languages', barList(s.langs, t.views)) +
      card('Build', barList(s.builds, t.views)) +
      card('Pages', barList(s.pages, t.views)) +
      card('Referrers', barList(s.refs, t.views)) +
      card('Route distance', barList(s.distances, t.routes)) +
      card('Countries per route', barList(s.countries, t.routes)) +
      card('Screen size', barList(s.screens, t.views)) +
      (s.errors.length ? card('Failure reasons', barList(s.errors, t.failures)) : '');

    el.footnote.textContent =
      'Range ' + (s.from || '-') + ' to ' + (s.to || '-') + '. ' +
      '"Daily visitors" counts distinct visitors per day and is summed over the range, so a ' +
      'person returning on two days counts twice: no cross-day identifier exists, by design. ' +
      'Raw events are deleted after ' + payload.retentionDays + ' days; only these totals are kept. ' +
      'Generated ' + payload.generatedAt + '.';
  }

  /* -------------------------------------------------------------- events */

  document.querySelectorAll('[data-range]').forEach(function (button) {
    button.addEventListener('click', function () {
      document.querySelectorAll('[data-range]').forEach(function (b) { b.classList.remove('is-active'); });
      button.classList.add('is-active');
      state.range = button.getAttribute('data-range');
      load();
    });
  });
  document.getElementById('reload').addEventListener('click', load);
  el.token.addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });

  try {
    var saved = sessionStorage.getItem(TOKEN_KEY);
    if (saved) { el.token.value = saved; load(); }
  } catch (e) { /* ignore */ }
})();
</script>
</body>
</html>
