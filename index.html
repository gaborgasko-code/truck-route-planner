<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Planificador de ruta - Gabor: rutas por carretera, tiempos de conduccion UE, peajes, paradas legales y aparcamiento seguro para vehiculos pesados.">
<title>Planificador de ruta - Gabor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/theme.css">
<script>
  /* Match the theme chosen in the app before anything paints. */
  (function () {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('trp.theme')); } catch (e) { /* ignore */ }
    var dark = saved === 'dark' ||
      (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>
  html, body { height: 100%; }
  .splash {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    /* The brand blue, lifted by two soft glows so it does not read flat. */
    background:
      radial-gradient(900px 520px at 82% -10%, rgba(59, 122, 230, .55), transparent 62%),
      radial-gradient(700px 520px at 4% 110%, rgba(14, 159, 142, .32), transparent 60%),
      linear-gradient(140deg, #0b1e45 0%, #10306f 50%, #1f5fd0 100%);
  }
  .splash__card {
    width: min(440px, 100%);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    padding: 32px 28px 24px;
    text-align: center;
  }
  .splash__mark {
    width: 56px; height: 56px; margin: 0 auto 16px;
    border-radius: 16px;
    background: var(--accent);
    color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 8px 20px rgba(37, 99, 235, .28);
  }
  .splash__mark svg { width: 30px; height: 30px; }
  .splash h1 { font-size: 22px; margin-bottom: 6px; letter-spacing: -.02em; }
  .splash__sub { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; line-height: 1.55; }
  .splash__status {
    font-size: 12.5px; color: var(--ink-soft); font-weight: 500;
    margin-bottom: 18px; min-height: 18px;
  }
  .splash__choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .splash__note { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.55; }
  .splash__lang { margin-top: 14px; display: flex; justify-content: center; gap: 6px; }
  .splash__lang button {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
  }
  .splash__lang button:hover { background: var(--surface-2); }
  .splash__lang button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .splash__by {
    margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line);
    display: flex; justify-content: center;
  }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--line-strong); border-top-color: var(--accent);
    display: inline-block; vertical-align: -2px; margin-right: 7px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<main class="splash">
  <div class="splash__card">
    <div class="splash__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5v8h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg></div>
    <h1 data-i18n="app.name">Planificador de ruta - Gabor</h1>
    <p class="splash__sub" data-i18n="app.subtitle"></p>

    <p class="splash__status" id="status"><span class="spinner"></span></p>

    <div class="splash__choice">
      <a class="btn btn--primary" href="desktop.html?view=desktop" data-i18n="splash.desktop"></a>
      <a class="btn btn--accent" href="mobile.html?view=mobile" data-i18n="splash.mobile"></a>
    </div>

    <p class="splash__note" id="detail"></p>

    <div class="splash__lang"><select class="lang-select lang-select--light" id="langSelect" aria-label="Idioma / Language"></select></div>

    <div class="splash__by">
      <a class="author-link author-link--lg" href="https://www.linkedin.com/in/gaborgasko/" target="_blank" rel="noopener noreferrer"
         aria-label="created by Gabor Gasko - open his LinkedIn profile">
<span class="author-link__label">created by</span><span class="author-link__name">Gabor Gasko</span>
      </a>
    </div>
  </div>
</main>

<script src="js/core/config.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/device.js"></script>
<script>
(function () {
  'use strict';
  var t = TRP.i18n.t;
  var redirect = null;

  TRP.i18n.init().then(render);

  var status = document.getElementById('status');
  var detail = document.getElementById('detail');
  var langSelect = document.getElementById('langSelect');
  var choice = TRP.device.resolveView();
  var info = TRP.device.inspect();

  function renderLanguages() {
    if (!langSelect.options.length) {
      langSelect.innerHTML = TRP.i18n.available().map(function (code) {
        return '<option value="' + code + '">' + TRP.i18n.languageName(code) + '</option>';
      }).join('');
    }
    langSelect.value = TRP.i18n.lang();
  }

  function render() {
    TRP.i18n.applyDom(document);
    var reason = { url: 'splash.reasonUrl', saved: 'splash.reasonSaved', auto: 'splash.reasonAuto' }[choice.reason];
    status.innerHTML = '<span class="spinner"></span>' + t(reason) + ': <strong>' +
      t(choice.view === 'mobile' ? 'splash.mobile' : 'splash.desktop') + '</strong>';

    detail.innerHTML = t('splash.screen', { w: info.width || '?' }) + ' &middot; ' +
      t(info.coarsePointer ? 'splash.touch' : 'splash.pointer') + ' &middot; ' +
      t(info.isPhoneUA ? 'splash.phone' : info.isTabletUA ? 'splash.tablet' : 'splash.computer') +
      '<br>' + t('splash.override');
    renderLanguages();
  }

  langSelect.addEventListener('change', function () {
    /* Choosing a language means the visitor wants to read this page first. */
    if (redirect) { clearTimeout(redirect); redirect = null; }
    langSelect.disabled = true;
    TRP.i18n.setAsync(langSelect.value).then(function () {
      langSelect.disabled = false;
      render();
    });
  });

  /* Only a choice made here is remembered; the in-app view links are not sticky. */
  document.querySelector('.splash__choice').addEventListener('click', function (event) {
    var link = event.target.closest('a[href]');
    if (!link) return;
    TRP.device.remember(/mobile/.test(link.getAttribute('href')) ? 'mobile' : 'desktop');
  });

  render();

  redirect = setTimeout(function () {
    location.replace((choice.view === 'mobile' ? 'mobile.html' : 'desktop.html') + '?view=' + choice.view);
  }, 1400);
})();
</script>
<noscript>
  <p style="text-align:center;padding:16px;color:var(--ink)">
    Se necesita JavaScript. Elija arriba la version de escritorio o la version movil.
    &mdash; JavaScript is required. Choose the desktop or mobile version above.
  </p>
</noscript>
</body>
</html>
