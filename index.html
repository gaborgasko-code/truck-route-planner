<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4ea2">
<meta name="description" content="Truck Route Planner - rutas por carretera, tiempos de conduccion UE, peajes, paradas legales y aparcamiento seguro para vehiculos pesados.">
<title>Truck Route Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/theme.css">
<script>
  /* Match the theme chosen in the app before anything paints. */
  (function () {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('trp.theme')); } catch (e) { /* ignore */ }
    var dark = saved === 'dark' ||
      (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>
  html, body { height: 100%; }
  .splash {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(140deg, #062546, #0b4ea2 55%, #1360c4);
    padding: 24px;
  }
  .splash__card {
    width: min(460px, 100%);
    background: var(--surface);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    padding: 28px 26px 22px;
    text-align: center;
  }
  .splash__mark {
    width: 66px; height: 66px; margin: 0 auto 16px;
    border-radius: 18px;
    background: var(--yellow-400);
    color: var(--blue-800);
    display: grid; place-items: center;
    font-size: 34px;
    box-shadow: 0 8px 22px rgba(240, 180, 0, .45);
  }
  .splash h1 { font-size: 22px; margin-bottom: 4px; }
  .splash__sub { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; }
  .splash__status {
    font-size: 12.5px; color: var(--blue-700); font-weight: 600;
    margin-bottom: 18px; min-height: 18px;
  }
  .splash__choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .splash__choice .btn { text-decoration: none; }
  .splash__note { margin-top: 16px; font-size: 11.5px; color: var(--muted); line-height: 1.55; }
  .splash__lang { margin-top: 14px; display: flex; justify-content: center; gap: 8px; }
  .splash__lang button {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
    border-radius: 999px; padding: 5px 15px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .splash__lang button[aria-pressed="true"] {
    background: var(--blue-700); color: #fff; border-color: var(--blue-700); font-weight: 700;
  }
  .splash__by {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 12px; font-weight: 700; color: var(--blue-800);
  }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--blue-100); border-top-color: var(--blue-600);
    display: inline-block; vertical-align: -3px; margin-right: 7px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  [data-theme="dark"] .splash__by,
  [data-theme="dark"] .splash__status { color: var(--yellow-400); }
</style>
</head>
<body>

<main class="splash">
  <div class="splash__card">
    <div class="splash__mark" aria-hidden="true">&#128667;</div>
    <h1>Truck Route Planner</h1>
    <p class="splash__sub" data-i18n="app.subtitle"></p>

    <p class="splash__status" id="status"><span class="spinner"></span></p>

    <div class="splash__choice">
      <a class="btn btn--primary" href="desktop.html?view=desktop" data-i18n="splash.desktop"></a>
      <a class="btn btn--accent" href="mobile.html?view=mobile" data-i18n="splash.mobile"></a>
    </div>

    <p class="splash__note" id="detail"></p>

    <div class="splash__lang" id="langButtons"></div>

    <p class="splash__by">created by Gabor Gasko</p>
  </div>
</main>

<script src="js/core/config.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/device.js"></script>
<script>
(function () {
  'use strict';
  var t = TRP.i18n.t;
  var redirect = null;

  TRP.i18n.init();

  var status = document.getElementById('status');
  var detail = document.getElementById('detail');
  var langButtons = document.getElementById('langButtons');
  var choice = TRP.device.resolveView();
  var info = TRP.device.inspect();

  function renderLanguages() {
    langButtons.innerHTML = TRP.i18n.available().map(function (code) {
      return '<button type="button" data-lang="' + code + '" aria-pressed="' +
        (code === TRP.i18n.lang()) + '">' + TRP.i18n.languageName(code) + '</button>';
    }).join('');
  }

  function render() {
    TRP.i18n.applyDom(document);
    var reason = { url: 'splash.reasonUrl', saved: 'splash.reasonSaved', auto: 'splash.reasonAuto' }[choice.reason];
    status.innerHTML = '<span class="spinner"></span>' + t(reason) + ': <strong>' +
      t(choice.view === 'mobile' ? 'splash.mobile' : 'splash.desktop') + '</strong>';

    detail.innerHTML = t('splash.screen', { w: info.width || '?' }) + ' &middot; ' +
      t(info.coarsePointer ? 'splash.touch' : 'splash.pointer') + ' &middot; ' +
      t(info.isPhoneUA ? 'splash.phone' : info.isTabletUA ? 'splash.tablet' : 'splash.computer') +
      '<br>' + t('splash.override');
    renderLanguages();
  }

  langButtons.addEventListener('click', function (event) {
    var button = event.target.closest('[data-lang]');
    if (!button) return;
    /* Choosing a language means the visitor wants to read this page first. */
    if (redirect) { clearTimeout(redirect); redirect = null; }
    TRP.i18n.set(button.getAttribute('data-lang'));
    render();
  });

  render();

  redirect = setTimeout(function () {
    location.replace((choice.view === 'mobile' ? 'mobile.html' : 'desktop.html') + '?view=' + choice.view);
  }, 1400);
})();
</script>
<noscript>
  <p style="text-align:center;padding:16px;color:#fff">
    Se necesita JavaScript. Elija arriba la version de escritorio o la version movil.
    &mdash; JavaScript is required. Choose the desktop or mobile version above.
  </p>
</noscript>
</body>
</html>
