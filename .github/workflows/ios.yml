# Truck Route Planner - build the iOS app on a macOS runner.
#
# iOS binaries can only be produced on macOS, and this project is developed on
# Windows. Rather than require a Mac, the build runs here: the repository is
# public, so GitHub's macOS runners cost nothing.
#
# Two modes:
#
#   unsigned  (default)  Builds the app and uploads a .app for inspection.
#                        Needs no Apple account, no certificates, no secrets.
#                        This is what runs on every push.
#
#   signed    (manual)   Produces an installable .ipa and can upload it to
#                        TestFlight. Requires an Apple Developer Program
#                        membership and the four secrets listed below.
#
# created by Gabor Gasko

name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'css/**'
      - 'data/**'
      - 'assets/**'
      - '*.html'
      - 'capacitor.config.json'
      - 'package.json'
      - 'tools/build-app*.js'
      - 'tools/build-ios-resources.js'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      signed:
        description: 'Produce a signed .ipa (needs the Apple secrets)'
        type: boolean
        default: false
      testflight:
        description: 'Upload the .ipa to TestFlight'
        type: boolean
        default: false

jobs:
  build:
    # macos-latest is Apple silicon and ships a current Xcode.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # The web app is the product; if its own tests fail there is no point
      # packaging it.
      - name: Test
        run: npm test

      - name: Assemble the web bundle
        run: npm run build:app

      - name: Render the icon and splash sources
        run: npm run build:icons

      - name: Generate the staged iOS resources
        run: node tools/build-ios-resources.js

      # ios/ is deliberately not committed: it is generated, and a checked-in
      # Xcode project is a merge-conflict machine that drifts from the config.
      - name: Create the Xcode project
        run: npx cap add ios

      # Reads icon.png, splash.png and splash-dark.png from --assetPath and
      # writes every size Xcode wants into ios/App, which is where `cap add`
      # puts the project and where this tool looks by default.
      - name: Generate the platform icons and splash screens
        run: npx @capacitor/assets generate --ios --assetPath assets/generated

      - name: Apply the privacy manifest and localisations
        run: |
          cp ios-resources/App/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
          cp -R ios-resources/App/*.lproj ios/App/App/
          node tools/apply-ios-plist.js

      - name: Sync
        run: npx cap sync ios

      # ---------------------------------------------------------------- unsigned

      - name: Build (unsigned)
        if: ${{ github.event.inputs.signed != 'true' }}
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package the unsigned app
        if: ${{ github.event.inputs.signed != 'true' }}
        run: |
          mkdir -p artifacts
          cd build/Build/Products/Release-iphoneos
          zip -qry "$GITHUB_WORKSPACE/artifacts/Planificador-unsigned.zip" App.app
          cd "$GITHUB_WORKSPACE"
          ls -lh artifacts

      # ------------------------------------------------------------------ signed

      # Requires, in repository secrets:
      #   APPLE_CERTIFICATE_P12        base64 of the distribution .p12
      #   APPLE_CERTIFICATE_PASSWORD   its password
      #   APPLE_PROVISIONING_PROFILE   base64 of the .mobileprovision
      #   APPLE_TEAM_ID                the ten-character team id
      # And for TestFlight upload:
      #   APPSTORE_ISSUER_ID / APPSTORE_KEY_ID / APPSTORE_PRIVATE_KEY
      - name: Import the signing certificate
        if: ${{ github.event.inputs.signed == 'true' }}
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::error::signed build requested but APPLE_CERTIFICATE_P12 is not set"
            exit 1
          fi
          # A throwaway keychain, so nothing is left behind on the runner.
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          echo "$CERT" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f certificate.p12

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Build and export the .ipa
        if: ${{ github.event.inputs.signed == 'true' }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath artifacts

          ls -lh artifacts

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.signed == 'true' && github.event.inputs.testflight == 'true' }}
        env:
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY" | base64 --decode > \
            ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app -f artifacts/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # --------------------------------------------------------------- artifacts

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: planificador-ios
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
