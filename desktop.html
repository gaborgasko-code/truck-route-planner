<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Planificador de ruta - Gabor: rutas por carretera, tiempos de conduccion UE, peajes, paradas legales y aparcamiento seguro para vehiculos pesados.">
<title>Planificador de ruta - Gabor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/desktop.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5v8h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg></div>
      <div>
        <h1 class="brand__title" data-i18n="app.name">Planificador de ruta - Gabor</h1>
        <div class="brand__tagline" data-i18n="app.tagline"></div>
      </div>
    </div>
    <div class="header-meta">
      <span class="chip" id="appVersion">v2.1.0</span>
      <span class="chip"><span data-i18n="app.source"></span>: <span id="dataSource">-</span></span>
      <a class="author-link" href="https://www.linkedin.com/in/gaborgasko/" target="_blank" rel="noopener noreferrer"
         aria-label="created by Gabor Gasko - open his LinkedIn profile">
<span class="author-link__label">created by</span><span class="author-link__name">Gabor Gasko</span>
      </a>
      <select class="lang-select" id="langSelect" aria-label="Idioma / Language"></select>
      <button type="button" class="icon-btn" id="themeToggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
      <a class="link-btn" href="mobile.html?view=mobile" data-i18n="app.mobileView"></a>
      <a class="link-btn" href="USER_GUIDE.html" target="_blank" rel="noopener" data-i18n="app.userGuide"></a>
    </div>
  </header>

  <div class="layout">

    <!-- ------------------------------------------------------- sidebar -->
    <aside class="sidebar">

      <section class="sidebar__section">
        <h3 data-i18n="form.route"></h3>

        <div class="field">
          <label for="originInput" data-i18n="form.origin"></label>
          <input type="text" id="originInput" autocomplete="off" spellcheck="false"
                 data-i18n-attr="placeholder:form.originPlaceholder">
          <div class="suggest" id="originSuggest" role="listbox" hidden></div>
        </div>

        <div class="swap-row">
          <button type="button" class="swap-btn" id="swapBtn"
                  data-i18n-attr="title:form.swap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg></button>
        </div>

        <div class="field">
          <label for="destInput" data-i18n="form.destination"></label>
          <input type="text" id="destInput" autocomplete="off" spellcheck="false"
                 data-i18n-attr="placeholder:form.destinationPlaceholder">
          <div class="suggest" id="destSuggest" role="listbox" hidden></div>
        </div>

        <div class="field">
          <label for="departureInput" data-i18n="form.departure"></label>
          <input type="datetime-local" id="departureInput">
        </div>

        <div class="btn-row">
          <button type="button" class="btn btn--primary" id="calcBtn" data-i18n="form.calculate"></button>
          <button type="button" class="btn btn--accent" id="mapBtn" data-i18n="form.showMap" disabled></button>
          <button type="button" class="btn btn--ghost" id="resetBtn" data-i18n="form.reset"></button>
        </div>

        <div class="progress" id="progress" hidden>
          <div class="progress__bar"><div class="progress__fill" id="progressFill"></div></div>
          <div class="progress__text" id="progressText"></div>
        </div>
      </section>

      <details class="sidebar__section" open>
        <summary data-i18n="form.vehicle"></summary>

        <div class="field-row">
          <div class="field">
            <label for="weightInput" data-i18n="form.weight"></label>
            <input type="number" id="weightInput" min="1" max="100" step="0.5" value="40">
          </div>
          <div class="field">
            <label for="axlesSelect" data-i18n="form.axles"></label>
            <select id="axlesSelect">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5" selected>5</option>
              <option value="6">6+</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="euroSelect" data-i18n="form.emission"></label>
            <select id="euroSelect">
              <option value="VI" selected>EURO VI</option>
              <option value="V">EURO V</option>
              <option value="IV">EURO IV</option>
              <option value="III">EURO III</option>
              <option value="II">EURO II</option>
            </select>
          </div>
          <div class="field">
            <label for="speedInput" data-i18n="form.speed"></label>
            <input type="number" id="speedInput" min="30" max="130" step="1" value="70">
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="fuelInput" data-i18n="form.fuel"></label>
            <input type="number" id="fuelInput" min="0" max="120" step="0.5" value="30">
          </div>
          <div class="field">
            <label for="fuelPriceInput" data-i18n="form.fuelPrice"></label>
            <input type="number" id="fuelPriceInput" min="0" max="10" step="0.01" value="1.65">
          </div>
        </div>

        <div class="field">
          <label class="checkbox">
            <input type="checkbox" id="adrCheck">
            <span data-i18n="form.adr"></span>
          </label>
        </div>
      </details>

      <details class="sidebar__section">
        <summary data-i18n="form.tollAnalysis"></summary>
        <div class="field">
          <label for="tollDetailSelect" data-i18n="form.tollDetail"></label>
          <select id="tollDetailSelect">
            <option value="fast" data-i18n="form.tollFast"></option>
            <option value="balanced" selected data-i18n="form.tollBalanced"></option>
            <option value="precise" data-i18n="form.tollPrecise"></option>
          </select>
        </div>
        <p class="note" data-i18n="form.tollNote"></p>
      </details>

    </aside>

    <!-- ----------------------------------------------------- workspace -->
    <section class="content">
      <nav class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" data-tab="overview" aria-selected="true"><span data-i18n="tab.overview"></span></button>
        <button type="button" class="tab" role="tab" data-tab="itinerary" aria-selected="false"><span data-i18n="tab.itinerary"></span></button>
        <button type="button" class="tab" role="tab" data-tab="legal" aria-selected="false"><span data-i18n="tab.legal"></span> <span class="tab__count" id="tabLegalCount">0</span></button>
        <button type="button" class="tab" role="tab" data-tab="tolls" aria-selected="false"><span data-i18n="tab.tolls"></span> <span class="tab__count" id="tabTollsCount">0</span></button>
        <button type="button" class="tab" role="tab" data-tab="stops" aria-selected="false"><span data-i18n="tab.stops"></span> <span class="tab__count" id="tabStopsCount">0</span></button>
        <button type="button" class="tab" role="tab" data-tab="regulations" aria-selected="false"><span data-i18n="tab.regulations"></span> <span class="tab__count" id="tabRegsCount">0</span></button>
        <button type="button" class="tab" role="tab" data-tab="map" aria-selected="false"><span data-i18n="tab.map"></span></button>
        <button type="button" class="tab" role="tab" data-tab="report" aria-selected="false"><span data-i18n="tab.report"></span></button>
      </nav>

      <div class="panels">
        <div class="panel" data-panel="overview" id="panelOverview"></div>
        <div class="panel" data-panel="itinerary" id="panelItinerary" hidden></div>
        <div class="panel" data-panel="legal" id="panelLegal" hidden></div>
        <div class="panel" data-panel="tolls" id="panelTolls" hidden></div>
        <div class="panel" data-panel="stops" id="panelStops" hidden></div>
        <div class="panel" data-panel="regulations" id="panelRegulations" hidden></div>

        <div class="panel panel--map" data-panel="map" hidden>
          <div class="map-shell">
            <div class="map-canvas" id="mapCanvas"></div>
            <div class="map-floating-actions">
              <button type="button" class="btn btn--accent" id="openMapBtn" data-i18n="map.openStandalone" disabled></button>
              <button type="button" class="btn btn--ghost" id="downloadMapBtn" data-i18n="map.downloadMap" disabled></button>
            </div>
          </div>
        </div>

        <div class="panel" data-panel="report" id="panelReport" hidden>
          <div class="card">
            <div class="card__title" data-i18n="report.title"></div>
            <div class="panel-actions">
              <button type="button" class="btn btn--primary" id="copyReportBtn" data-i18n="report.copy" disabled></button>
              <button type="button" class="btn btn--ghost" id="downloadReportBtn" data-i18n="report.downloadTxt" disabled></button>
              <button type="button" class="btn btn--ghost" id="downloadGpxBtn" data-i18n="report.downloadGpx" disabled></button>
              <button type="button" class="btn btn--ghost" id="downloadJsonBtn" data-i18n="report.downloadJson" disabled></button>
              <button type="button" class="btn btn--ghost" id="printBtn" data-i18n="report.print"></button>
            </div>
            <textarea class="report" id="reportText" readonly spellcheck="false"
                      data-i18n-attr="aria-label:report.title"></textarea>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer class="app-footer">
    <span data-i18n-html="app.footerDisclaimer"></span>
    <span class="spacer"></span>
    <a class="author-link author-link--onDark" href="https://www.linkedin.com/in/gaborgasko/" target="_blank" rel="noopener noreferrer"
       aria-label="created by Gabor Gasko - open his LinkedIn profile">
<span class="author-link__label">created by</span><span class="author-link__name">Gabor Gasko</span>
    </a>
  </footer>
</div>

<div class="toast-host" id="toastHost" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>

<script src="js/core/config.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/geo.js"></script>
<script src="js/core/embedded-data.js"></script>
<script src="js/core/data-store.js"></script>
<script src="js/core/api.js"></script>
<script src="js/core/time-model.js"></script>
<script src="js/core/eu-rules.js"></script>
<script src="js/core/tolls.js"></script>
<script src="js/core/stops.js"></script>
<script src="js/core/regulations.js"></script>
<script src="js/core/planner.js"></script>
<script src="js/core/map-export.js"></script>
<script src="js/core/device.js"></script>

<script src="js/ui/render.js"></script>
<script src="js/ui/map-view.js"></script>
<script src="js/ui/app-common.js"></script>
<script src="js/ui/desktop-app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache is optional */ });
    });
  }
</script>
</body>
</html>
